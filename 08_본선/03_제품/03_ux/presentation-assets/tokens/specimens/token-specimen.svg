<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="JByond presentation token specimen">
  <defs>
    <linearGradient id="stageCover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08124A"/>
      <stop offset="21.6%" stop-color="#6583EC"/>
      <stop offset="46.5%" stop-color="#08124A"/>
      <stop offset="100%" stop-color="#08124A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .k { font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; }
      .d { font-family: Panchang, Pretendard, sans-serif; }
      .muted { fill: rgba(255,255,255,0.65); }
      .small { font-size: 20px; font-weight: 500; }
      .label { font-size: 18px; font-weight: 600; fill: #FFFFFF; }
      .body { font-size: 18px; font-weight: 400; fill: rgba(255,255,255,0.78); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#000B49"/>
  <rect x="48" y="48" width="1504" height="904" rx="28" fill="url(#stageCover)"/>
  <text x="96" y="130" class="k muted" font-size="30" font-weight="600">JByond Presentation Token Specimen</text>
  <text x="96" y="300" class="d" font-size="150" font-weight="500" letter-spacing="9" fill="#FFFFFF">JByond</text>
  <text x="102" y="365" class="k" font-size="40" font-weight="500" fill="#FFFFFF">금융 Case가 들어오면 AI Agent가 근거를 정리하고, 사람은 승인한다.</text>
  <g transform="translate(96 450)">
    <rect width="188" height="96" rx="14" fill="#08124A"/><text x="20" y="58" class="label k">navy.900</text>
    <rect x="208" width="188" height="96" rx="14" fill="#6583EC"/><text x="228" y="58" class="label k">blue.500</text>
    <rect x="416" width="188" height="96" rx="14" fill="#4660C1"/><text x="436" y="58" class="label k">blue.600</text>
    <rect x="624" width="188" height="96" rx="14" fill="#F0F4FF"/><text x="644" y="58" class="k" font-size="18" font-weight="600" fill="#000000">blue.100</text>
    <rect x="832" width="188" height="96" rx="14" fill="#FFECEC"/><text x="852" y="58" class="k" font-size="18" font-weight="600" fill="#000000">pink.050</text>
  </g>
  <g transform="translate(96 610)">
    <rect width="560" height="230" rx="18.88" fill="#FFFFFF" filter="url(#softShadow)"/>
    <text x="150" y="56" class="k" font-size="28.3158" font-weight="600" fill="#000000">JB Local Guard OS - 전체 시스템 플로우</text>
    <rect x="44" y="92" width="128" height="34" rx="7.55" fill="#4660C1"/>
    <text x="70" y="115" class="k" font-size="18.1574" font-weight="500" fill="#FFFFFF">사용자 신호</text>
    <rect x="44" y="146" width="128" height="58" rx="7.55" fill="#F0F4FF" stroke="#565656" stroke-width="0.64"/>
    <text x="65" y="171" class="k" font-size="17.6491" fill="#000000">Case Hub</text>
    <text x="58" y="193" class="k" font-size="11.3263" fill="#000000">케이스 등록 / 실행 로그</text>
  </g>
  <g transform="translate(720 610)">
    <rect width="330" height="230" rx="10" fill="rgba(255,255,255,0.10)" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="0" y="0" width="330" height="142" rx="10" fill="#3E63BD"/>
    <text x="30" y="180" class="k" font-size="20" font-weight="400" fill="rgba(255,255,255,0.80)">3. RM은 근거 패키지를 바탕으로 판단한다.</text>
  </g>
  <g transform="translate(1110 610)">
    <text x="0" y="0" class="k" font-size="22" fill="rgba(255,255,255,0.70)">Dense Table Text</text>
    <text x="0" y="46" class="k" font-size="16.4294" font-weight="500" fill="rgba(255,255,255,0.90)">활용데이터 / 활용방식</text>
    <line x1="0" y1="68" x2="360" y2="68" stroke="#FFFFFF" stroke-width="1"/>
    <text x="0" y="102" class="k" font-size="15.5227" font-weight="500" fill="rgba(255,255,255,0.90)">CaseOps Engine</text>
    <text x="0" y="132" class="k" font-size="15.5227" font-weight="500" fill="rgba(255,255,255,0.90)">Evidence Graph RAG</text>
  </g>
